# Ablation: RL without pairwise pretraining (random init; the pairwise BCE stays as aux loss).
env:
  shop_mode: uniform
  n_range: [4, 64]
  T_range: [4, 300]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
  ref_pool: 512
train:
  n_envs: 256
rl:
  init: null
  temperature: 1.0
  actor_warmup: 0
  actor_lr: 3.0e-4
