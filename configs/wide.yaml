# v2: cover the benchmark range. PD1 has 5..1414 steps per full training; a 1000-step budget
# is 0.7..200 full trainings. Half of the episodes cap runs at T, as the tabular benchmarks do.
env:
  shop_mode: uniform
  n_range: [4, 64]
  T_range: [4, 300]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
train:
  n_envs: 256
  iters: 100000
  h_start: 1.0
  h_end: 1.0
