# wide-focus03 + random hp token slots: the d active hps go to a random subset of the d_max slots, in random order,
# redrawn per episode (the presence mask moves with them). Before this, active hps always sat in slots 0..d-1, so
# the scorer was not order-invariant and slot k was active in only (10-k)/10 of training tasks (journal 2026-11-20).
env:
  shop_mode: uniform
  n_range: [4, 64]
  T_range: [4, 300]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
  random_slots: true
train:
  n_envs: 256
  iters: 100000
  pair_low: 0.3
