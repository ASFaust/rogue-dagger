# Implicit-actor discrete SAC on the frozen wide-v1 trunk (roguedagger.sac): the automl-exam sac_frozen3 recipe.
# Same env distribution as wide.yaml (the trunk's pretraining distribution) + the regret reference pool.
env:
  shop_mode: uniform
  n_range: [4, 64]
  T_range: [4, 300]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
  ref_pool: 512
train:
  n_envs: 128
sac:
  init: runs/wide-v1/last.pt
