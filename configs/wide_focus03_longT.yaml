# wide-focus03 with curve lengths up to 1500 (PD1 has T up to 1414; training T stopped at 300).
# Big-shop models lose PD1 mostly on long-curve, low-budget tasks; this tests the T range alone.
env:
  shop_mode: uniform
  n_range: [4, 64]
  T_range: [4, 1500]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
train:
  n_envs: 256
  iters: 100000
  pair_low: 0.3
