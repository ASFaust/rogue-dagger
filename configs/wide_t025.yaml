# wide.yaml with training rollouts at τ=0.25 (the deploy temperature picked on the synthetic prior).
# With τ=1 the scores flatten during training (entropy 1.3 -> 3.2), the policy starts more and more
# runs, and training states drift away from what the deployed τ=0.25 policy visits.
env:
  shop_mode: uniform
  n_range: [4, 64]
  T_range: [4, 300]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
train:
  n_envs: 256
  iters: 100000
  temperature: 0.25
  h_start: 1.0
  h_end: 1.0
eval:
  temperature: 0.25
