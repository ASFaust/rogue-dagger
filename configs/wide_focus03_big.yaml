# The two pairwise changes that helped: pair weighting 0.3 (PD1, LCBench) and train shops up to 256 (TaskSet, LCBench).
env:
  shop_mode: uniform
  n_range: [4, 256]
  T_range: [4, 300]
  budget_full_range: [0.5, 200.0]
  B_range: [20, 1200]
  p_cap: 0.5
train:
  n_envs: 256
  iters: 100000
  pair_low: 0.3
